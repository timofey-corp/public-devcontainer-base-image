# Builds and publishes the prebuilt devcontainer image
# (ghcr.io/timofey-corp/public-devcontainer-base-image) from the Dockerfile
# at the repo root.
#
# - Nightly: compares upstream versions (base image digest, node LTS, and
#   tool versions from GitHub releases, crates.io, and Anthropic's release
#   feed) against the versions.json asset of the newest GitHub release;
#   rebuilds and releases only when something changed.
# - Push to main touching the image definition: always rebuilds.
# - Manual dispatch: force=true rebuilds unconditionally; force=false just
#   runs the up-to-date check (and rebuilds if needed).
#
# Each platform is built and smoke-tested natively on its own runner — no
# QEMU: the Claude Code installer executes the downloaded binary, which is
# unreliable under emulation, and compiling htmlq emulated is very slow. The
# per-platform images are pushed by digest only; the release job assembles
# them into the multi-arch tags, so a tag only ever points at smoke-tested
# images.
name: devcontainer-image

on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/devcontainer-image.yml"
      - ".github/scripts/devcontainer-image-versions.sh"
      - ".github/scripts/devcontainer-image-smoke.sh"
  workflow_dispatch:
    inputs:
      force:
        description: Build and release even if nothing upstream changed
        type: boolean
        default: false

permissions:
  contents: write # create the release + tag
  packages: write # push the image to GHCR

concurrency:
  group: devcontainer-image
  cancel-in-progress: false

# Explicit bash so run steps get `-o pipefail` (the default shell omits it,
# which once let a failed versions script hide behind a successful `tee`)
defaults:
  run:
    shell: bash

env:
  # Resolves to ghcr.io/timofey-corp/public-devcontainer-base-image: the image
  # is always named after the repository.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      needs_build: ${{ steps.decide.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute upstream version manifest
        run: |
          .github/scripts/devcontainer-image-versions.sh | tee versions.json
          jq -e .tools versions.json > /dev/null

      - name: Fetch manifest of newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${GITHUB_REPOSITORY}" \
            --pattern versions.json --output previous.json \
            || echo "No previous release manifest found."

      - name: Decide whether a rebuild is needed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          reason=""
          if [[ "${EVENT_NAME}" == "push" ]]; then
            reason="image definition changed"
          elif [[ "${FORCE}" == "true" ]]; then
            reason="forced via workflow_dispatch"
          elif [[ ! -f previous.json ]]; then
            reason="no previous release"
          elif ! diff <(jq -S . previous.json) <(jq -S . versions.json); then
            reason="upstream versions changed"
          fi
          if [[ -n "${reason}" ]]; then
            echo "Rebuild needed: ${reason}"
            echo "needs_build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Image is up to date; nothing to do."
            echo "needs_build=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.json

  build:
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm # GitHub-hosted arm64, free for public repos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pushed by digest only, untagged. The Dockerfile resolves upstream
      # "latest" versions at build time, so never reuse cached layers or a
      # stale base image. provenance=false keeps the push a plain
      # single-platform manifest (BuildKit would otherwise wrap it in an index
      # carrying an attestation manifest).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          pull: true
          provenance: false

      - name: Smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -v "${PWD}/.github/scripts:/smoke:ro" \
            "${IMAGE}@${DIGEST}" bash /smoke/devcontainer-image-smoke.sh

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versions

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pick release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="${base}"
          n=1
          while gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}.${n}"
          done
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"

      # Both platform images passed their smoke tests to get here; only now do
      # they get the tags the devcontainers actually pull.
      - name: Create multi-arch tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          ls -1
          [[ "$(ls -1 | wc -l)" -eq 2 ]] || { echo "expected exactly 2 platform digests" >&2; exit 1; }
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" --tag "${IMAGE}:latest" \
            $(printf -- "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "Prebuilt devcontainer image:"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Also tagged \`latest\`. Platforms: linux/amd64, linux/arm64."
            echo
            echo "| Component | Version |"
            echo "| --- | --- |"
            jq -r '
              [["base image", .base_image],
               ["node (LTS)", .node_lts]]
              + (.tools | to_entries | map([.key, .value]))
              | .[] | "| \(.[0]) | \(.[1]) |"
            ' versions.json
            echo
            echo "tmux and ripgrep come from Debian trixie and refresh on every rebuild."
          } > notes.md
          gh release create "${TAG}" versions.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Devcontainer image ${TAG}" \
            --notes-file notes.md
